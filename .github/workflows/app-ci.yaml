# App-side PR quality gates (app plan M0 PR 0.5).
#
# Runs in the SAME image as the local `./dev` toolchain (ADR-002,
# docs/architecture/2026-07-14-adr-002-containerized-dev-toolchain.md), so
# "works in ./dev" and "works in CI" are the same claim. Gates in force from
# M0; M1+ component scaffolds add their own suites, which `pnpm -r` picks up
# automatically as packages define typecheck/test scripts.
#
# Deliberately NOT here: anything needing the devnet node — the
# ghcr.io/provlabs/vault-dev-node image contains the pre-release vault
# module. Fixture capture/generation and live drills stay local/scheduled
# until PR 8.0 pins a released vault.
name: app-ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: workspace · typecheck · test · fixtures gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:22-bookworm-slim # keep in lockstep with infra/dev/compose.yaml tools image
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: ${{ github.workspace }}/.corepack
    steps:
      - uses: actions/checkout@v5

      - name: Restore pnpm store + corepack cache
        uses: actions/cache@v4
        with:
          path: |
            .pnpm-store
            .corepack
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # --frozen-lockfile doubles as the lockfile-discipline gate
      # (SECURITY.md: lockfiles are committed for every workspace).
      - name: Install (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile

      # Biome (biome.jsonc) is formatter AND linter for every JS/TS/CSS source
      # in the repo — including apps/console, which is outside the pnpm
      # workspace and therefore reached by no other job here. Runs before
      # typecheck so a formatting-only failure is reported as one.
      # Warnings do not fail the build; errors do.
      - name: Lint + format check (biome)
        run: corepack pnpm run lint

      - name: Typecheck (all workspace packages)
        run: corepack pnpm -r run typecheck

      - name: Test (all workspace packages)
        run: corepack pnpm -r run test

      # The corpus must always carry every terminal state (swap in, enqueue,
      # expedite, payout, refund, both settlement legs) — a PR that drops or
      # truncates a fixture fails here, not in M2 decode tests.
      - name: Fixture corpus completeness gate
        run: packages/fixtures/scripts/capture-fixtures.sh --check

  # apps/web gates that live outside `pnpm -r test` (app plan PR 1.3):
  # the dataviz palette validator (both themes) and the bundle-secret check
  # (SECURITY.md: nothing beyond the app-spec §7 client-safe subset in the
  # client bundle) — both standing security/design-executable gates.
  web-gates:
    name: web · palette validator · bundle-secret check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:22-bookworm-slim # keep in lockstep with infra/dev/compose.yaml tools image
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: ${{ github.workspace }}/.corepack
    steps:
      - uses: actions/checkout@v5
      - name: Restore pnpm store + corepack cache
        uses: actions/cache@v4
        with:
          path: |
            .pnpm-store
            .corepack
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile
      - name: Dataviz palette validator (light + dark token sets)
        run: corepack pnpm --filter @nvhash/web run check:palette
      - name: Bundle-secret check (§7 client-safe subset only)
        run: corepack pnpm --filter @nvhash/web run check:bundle

  # Offline e2e (Playwright + axe + MSW over @nvhash/fixtures). Runs in the
  # official Playwright image — the tag moves in LOCKSTEP with the exact
  # @playwright/test pin in apps/web/package.json and the
  # infra/dev/compose.yaml playwright service.
  web-e2e:
    name: web · Playwright e2e + axe (offline, MSW)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: ${{ github.workspace }}/.corepack
    steps:
      - uses: actions/checkout@v5
      - name: Restore pnpm store + corepack cache
        uses: actions/cache@v4
        with:
          path: |
            .pnpm-store
            .corepack
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile
      - name: Playwright e2e (build + serve with NVHASH_MOCK=1)
        run: corepack pnpm --filter @nvhash/web run test:e2e

  # Grant-boundary gate (ADR-001 Decision 1, action item 4; app plan PR 1.5) —
  # a standing services/* security-executable check (plan §4). It stands up the
  # two-domain role split (infra/dev/postgres/roles.sql), migrates the `indexed`
  # schema AS indexer_writer, and asserts the boundary: api_reader may read but
  # not write indexed; app_writer may not read indexed; indexer_writer holds no
  # privileges on `app`. Needs Postgres only (no devnet node), so it runs on
  # every PR — unlike the live-devnet suite. A regression in roles.sql fails here.
  # Since PR 3.1 it also runs the API's DB-backed reader gate (test:db): real
  # @nvhash/db-indexed queries as api_reader over rows seeded as indexer_writer.
  db-grants:
    name: services · grant-boundary + api reader (roles.sql + migrate + test:grants + test:db)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:22-bookworm-slim # keep in lockstep with infra/dev/compose.yaml tools image
    services:
      postgres:
        image: postgres:17-alpine # keep in lockstep with infra/dev/compose.yaml postgres image
        env:
          POSTGRES_USER: nvhash
          POSTGRES_PASSWORD: nvhash-dev
          POSTGRES_DB: nvhash
        options: >-
          --health-cmd "pg_isready -U nvhash -d nvhash"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: ${{ github.workspace }}/.corepack
      # Superuser URL the grant-boundary test SET ROLEs from; `postgres` is the
      # service hostname inside the job container.
      ADMIN_DATABASE_URL: postgresql://nvhash:nvhash-dev@postgres:5432/nvhash
    steps:
      - uses: actions/checkout@v5
      - name: Restore pnpm store + corepack cache
        uses: actions/cache@v4
        with:
          path: |
            .pnpm-store
            .corepack
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile
      - name: Install psql client (to apply roles.sql)
        run: apt-get update -qq && apt-get install -y --no-install-recommends postgresql-client >/dev/null
      - name: Apply role/schema boundary (roles.sql)
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/dev/postgres/roles.sql
      - name: Migrate indexed schema (as indexer_writer)
        run: corepack pnpm --filter @nvhash/indexer run migrate:deploy
        env:
          DATABASE_URL: postgresql://indexer_writer:indexer-dev@postgres:5432/nvhash?schema=indexed
      - name: Grant SELECT on pre-existing tables (new tables inherit via default privs)
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT SELECT ON ALL TABLES IN SCHEMA indexed TO api_reader;"
      - name: Grant-boundary test (test:grants)
        run: corepack pnpm --filter @nvhash/indexer run test:grants

      # Migration ↔ model drift. Each schema is ONE regenerated baseline rather
      # than an append-only chain (services/indexer/CLAUDE.md), which only holds
      # if the committed SQL still produces exactly what the models declare.
      # `--from-migrations` applies the baseline to a scratch database and
      # compares the result, so a hand-edited migration, a model edit that was
      # never regenerated, or a migration that cannot replay on an empty
      # database all fail here rather than on someone's next `pg reset`.
      - name: Create scratch databases for the drift check
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE shadow_indexed;" -c "CREATE DATABASE shadow_app;"
      - name: Migrations match the models (indexed + app)
        run: |
          corepack pnpm --filter @nvhash/indexer exec prisma migrate diff \
            --from-migrations prisma/migrations --to-schema-datamodel prisma \
            --shadow-database-url "postgresql://nvhash:nvhash-dev@postgres:5432/shadow_indexed" --exit-code
          corepack pnpm --filter @nvhash/web exec prisma migrate diff \
            --from-migrations prisma/migrations --to-schema-datamodel prisma \
            --shadow-database-url "postgresql://nvhash:nvhash-dev@postgres:5432/shadow_app" --exit-code
      - name: Generate @nvhash/db-indexed client (from the indexer's canonical schema)
        run: corepack pnpm --filter @nvhash/db-indexed run generate
      - name: API reader gate (test:db — real queries as api_reader)
        run: corepack pnpm --filter @nvhash/api run test:db
        env:
          API_READER_DATABASE_URL: postgresql://api_reader:api-dev@postgres:5432/nvhash?schema=indexed
          INDEXER_WRITER_DATABASE_URL: postgresql://indexer_writer:indexer-dev@postgres:5432/nvhash?schema=indexed

  # apps/console is deliberately OUTSIDE the pnpm workspace (ADR-001 Decision 4,
  # pnpm-workspace.yaml), so `pnpm -r` reaches none of it. Biome lints it from
  # the root, but nothing type-checked it until this job: an internal tool is
  # still shipped code, and a console that does not compile is found by whoever
  # next opens it rather than by CI.
  console:
    name: console · typecheck (standalone npm project)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: node:22-bookworm-slim # keep in lockstep with infra/dev/compose.yaml tools image
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v5
      - name: Install (lockfile-exact)
        run: npm ci
      - name: Typecheck (tsc -b)
        run: npm run typecheck

  shell-lint:
    name: shellcheck (devnet + tooling scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck at warning severity
        run: |
          # gate every tracked shell script plus the ./dev wrapper
          git ls-files '*.sh' | xargs shellcheck --severity=warning dev

# Publishes the deployable images to ghcr.io/provlabs on merge to main.
name: publish-images

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialized: concurrent merges must not race the version bump.
concurrency:
  group: publish-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: images · version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}
      short_sha: ${{ steps.compute.outputs.short_sha }}
      already_tagged: ${{ steps.compute.outputs.already_tagged }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: compute
        run: |
          set -euo pipefail
          existing="$(git tag --list 'v[0-9]*' --points-at HEAD --sort=-v:refname | head -n 1)"
          if [ -n "$existing" ]; then
            version="$existing"
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
          else
            latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
            if [ -z "$latest" ]; then
              version="v1.0.0"
            else
              IFS=. read -r major minor patch <<<"${latest#v}"
              version="v${major}.${minor}.$((patch + 1))"
            fi
            echo "already_tagged=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "publishing $version ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: images · ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: services/indexer
            image: nvhash-indexer
          - component: services/api
            image: nvhash-api
          - component: apps/web
            image: nvhash-web
          - component: apps/console
            image: nvhash-console
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ghcr.io/provlabs/${{ matrix.image }}:${{ needs.version.outputs.version }}
            ghcr.io/provlabs/${{ matrix.image }}:${{ needs.version.outputs.short_sha }}
            ghcr.io/provlabs/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The git tag lands only after all images publish, so a failed run burns no version.
  tag:
    name: images · git tag
    needs: [version, build]
    if: needs.version.outputs.already_tagged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: |
          git tag "${{ needs.version.outputs.version }}"
          git push origin "refs/tags/${{ needs.version.outputs.version }}"

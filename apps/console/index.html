<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Self-contained delivery (spec §12): strict CSP, only the configured LCD as a
         network peer. connect-src is GENERATED per profile from VITE_LCD_URL — the
         token below is replaced by vite.config.ts (scripts/csp.ts, which throws on
         anything wider than one exact origin) — never a hand-edited host list and
         never a blanket https: (SECURITY.md: injected code must not be able to
         exfiltrate to arbitrary hosts). Server headers may tighten further (8.4). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src __CSP_CONNECT_SRC__; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; object-src 'none'"
    />
    <title>nvHASH Console</title>
    <!-- Pre-paint theme resolution so the first frame is the right surface (no flash). -->
    <script>
      (() => {
        try {
          const t = localStorage.getItem("nvhash.theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (_e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

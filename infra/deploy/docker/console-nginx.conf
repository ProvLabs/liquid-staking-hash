# Console static serving. THE ONE LOAD-BEARING LINE is try_files' index.html
# fallback: the console is a BrowserRouter SPA whose page paths must not 404
# at the host, or the App→Console verify-link contract fails on every deep
# link (8.4b handoff (a); gated live by e2e/verify-links.live.spec.ts).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets are immutable; index.html must revalidate so a redeploy is
  # picked up promptly (the stale-bundle discipline, CO-18).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

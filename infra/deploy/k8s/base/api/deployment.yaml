# services/api — the read-only public /api/v1 tier (api_reader; an absent
# DATABASE_URL serves the honest dataless mode, so the secret ref is the
# fail-closed switch). TRUST_PROXY=true is legal ONLY where the ingress
# provably overwrites X-Forwarded-For (§4 invariant 12) — it lives in the
# overlay beside the ingress it depends on, never here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api }
    spec:
      containers:
        - name: api
          image: nvhash/api:overlay-sets-tag
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - name: http
      port: 80
      targetPort: http

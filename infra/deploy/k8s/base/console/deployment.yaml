# apps/console — static files (no processes of its own beyond the pinned
# static server). The image is built PER ENVIRONMENT (VITE_* + the generated
# CSP are compile-time), so the overlay pins console:{env}-{sha}. The two
# hosting facts the bundle cannot carry (plan §4 invariant 14) live at this
# layer: the SPA-fallback rewrite ships IN the image's nginx conf; the CSP
# response header (incl. frame-ancestors) is the overlay ingress's to add,
# from the same LCD-host facts that fed the build.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels: { app.kubernetes.io/name: console }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: console }
    spec:
      containers:
        - name: console
          image: nvhash/console:overlay-sets-tag
          ports: [{ containerPort: 8080, name: http }]
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: console
  labels: { app.kubernetes.io/name: console }
spec:
  selector: { app.kubernetes.io/name: console }
  ports:
    - name: http
      port: 80
      targetPort: http

# apps/web — the user web tier. One image serves every environment: the
# client-safe subset is serialized from SERVER env at request time (app-spec
# §7), so config is entirely ConfigMap/Secret, never baked. The healthz probe
# runs the boot checks (chain-id match, vault cross-check) — a misconfigured
# pod never becomes ready, which is the fail-closed posture the empty
# CONTRACT/VAULT addresses rely on before commit E lands the bootstrap output.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app.kubernetes.io/name: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web }
    spec:
      containers:
        - name: web
          image: nvhash/web:overlay-sets-tag
          ports: [{ containerPort: 3000, name: http }]
          envFrom:
            - configMapRef: { name: web-config }
            - secretRef: { name: web-secrets }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app.kubernetes.io/name: web }
spec:
  selector: { app.kubernetes.io/name: web }
  ports:
    - name: http
      port: 80
      targetPort: http

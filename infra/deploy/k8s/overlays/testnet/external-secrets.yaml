# D24 mechanism: external-secrets-operator (§7.1 Q1, decided as recommended).
# The repo holds REFERENCES (names), the store holds the values — a repo
# clone contains zero secret bytes, rotation happens in the store with no
# commit. `ExternalSecret` unsynced ⇒ Secret absent ⇒ pod never starts:
# fail-closed by construction. The store backend (`SecretStore` provider
# block) is an ops parameter of the cluster (§7 Q6) — the provider stanza is
# completed at deploy; the REFERENCE PATHS below are the contract.
#
# Store layout: testnet/<KEY> (C1: the env segment makes a cross-env read
# unrepresentable).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: nvhash-testnet-store
spec:
  provider: {} # completed at deploy for the chosen store (Vault / cloud SM)
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: indexer-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: nvhash-testnet-store, kind: SecretStore }
  target: { name: indexer-secrets }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: testnet/INDEXER_WRITER_DATABASE_URL }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: nvhash-testnet-store, kind: SecretStore }
  target: { name: api-secrets }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: testnet/API_READER_DATABASE_URL }
    - secretKey: API_SERVICE_ASSERTION_KEY
      remoteRef: { key: testnet/API_SERVICE_ASSERTION_KEY }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: web-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: nvhash-testnet-store, kind: SecretStore }
  target: { name: web-secrets }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: testnet/APP_WRITER_DATABASE_URL }
    - secretKey: API_SERVICE_ASSERTION_KEY
      remoteRef: { key: testnet/API_SERVICE_ASSERTION_KEY }
    - secretKey: WEB_PUSH_VAPID_PUBLIC_KEY
      remoteRef: { key: testnet/WEB_PUSH_VAPID_PUBLIC_KEY }
    - secretKey: WEB_PUSH_VAPID_PRIVATE_KEY
      remoteRef: { key: testnet/WEB_PUSH_VAPID_PRIVATE_KEY }
    - secretKey: WEB_PUSH_VAPID_SUBJECT
      remoteRef: { key: testnet/WEB_PUSH_VAPID_SUBJECT }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-provision-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: nvhash-testnet-store, kind: SecretStore }
  target: { name: db-provision-secrets }
  data:
    - secretKey: PROVISION_DATABASE_URL
      remoteRef: { key: testnet/PROVISION_DATABASE_URL }
    - secretKey: INDEXER_WRITER_PASSWORD
      remoteRef: { key: testnet/INDEXER_WRITER_PASSWORD }
    - secretKey: API_READER_PASSWORD
      remoteRef: { key: testnet/API_READER_PASSWORD }
    - secretKey: APP_WRITER_PASSWORD
      remoteRef: { key: testnet/APP_WRITER_PASSWORD }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grant-verify-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: nvhash-testnet-store, kind: SecretStore }
  target: { name: grant-verify-secrets }
  data:
    - secretKey: API_READER_DATABASE_URL
      remoteRef: { key: testnet/API_READER_DATABASE_URL }
    - secretKey: INDEXER_WRITER_DATABASE_URL
      remoteRef: { key: testnet/INDEXER_WRITER_DATABASE_URL }

# Workspace membership per ADR-001 Decision 4
# (docs/architecture/2026-07-14-adr-001-app-component-architecture.md):
# apps/web, services/*, and shared packages/*. apps/console stays a
# standalone npm project until its own migration opts it in.
packages:
  - apps/web
  - services/*
  - packages/*

# Dependency build-script allowlist (pnpm blocks all install scripts by
# default — SECURITY.md: "avoid install-script-heavy packages"). Prisma is the
# chosen ORM for the indexed/app schemas (app-spec §5.3, §9.1); its postinstall
# fetches the query/schema engine binaries that `prisma generate` needs. This
# is the reviewed decision to permit exactly those scripts, nothing else. Added
# with the services/indexer scaffold (app plan PR 1.1).
allowBuilds:
  # Biome is the workspace formatter + linter (one tool, one dependency, per
  # SECURITY.md's "prefer std/first-party, avoid install-script-heavy
  # packages"). Its postinstall only resolves the platform-native binary from
  # the already-declared optional dependencies — no network beyond the resolved
  # package. Reviewed and permitted on that basis; nothing else it ships runs.
  '@biomejs/biome': true
  '@prisma/client': true
  '@prisma/engines': true
  # esbuild's postinstall stages its platform-native binary for vite /
  # react-router builds (apps/web scaffold, app plan PR 1.3). Reviewed:
  # first-party install script, no network beyond the already-resolved
  # platform optional dependency.
  esbuild: true
  # msw (the apps/web offline mock harness) uses only the Node interceptor;
  # its postinstall is a support banner / browser-worker convenience. Denied
  # explicitly rather than left unreviewed.
  msw: false
  prisma: true

# Advisory exceptions for the CI `audit` gate (SECURITY.md "Dependencies and
# supply chain"). This file is the pnpm-11 home of auditConfig — pnpm no
# longer reads `package.json#pnpm`. EVERY id listed here MUST have an
# owner+reason+review-by row in docs/security/dependency-audit-exceptions.md;
# scripts/check-audit-exceptions.mjs fails CI in both directions. No severity
# floor and no workflow-side --ignore flags exist anywhere — a genuinely
# inapplicable advisory earns a named entry, never a threshold.
auditConfig:
  ignoreCves: []
  ignoreGhsas: []

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
# The indexer's configuration interface is environment variables, validated and
# bounded at the process boundary by src/config.ts (SECURITY.md). Values are
# deliberately NOT wrapped in Helm's `required`: a blank CONTRACT_ADDRESS, or a
# start height left at its out-of-range 0, must reach the process so its own
# bounded config rejects it and the container fails closed — rather than the
# chart failing to render, which would also block the rendered-manifest checks.
data:
  DATABASE_URL: {{ .Values.database.url | quote }}
  LCD_URL: {{ .Values.chain.lcdUrl | quote }}
  RPC_URL: {{ .Values.chain.rpcUrl | quote }}
  CHAIN_ID: {{ .Values.chain.chainId | quote }}
  CONTRACT_ADDRESS: {{ .Values.contract.address | quote }}
  VAULT_ADDRESS: {{ .Values.contract.vaultAddress | quote }}
  RECEIPT_DENOM: {{ .Values.contract.receiptDenom | quote }}
  INDEX_START_HEIGHT: {{ .Values.chain.startHeight | quote }}
  GOV_START_HEIGHT: {{ .Values.chain.govStartHeight | quote }}
  # Empty by default, and empty is the correct value on a chain whose contract
  # admin resolves to a group policy: discovery finds those on its own. It is
  # needed for a contract instantiated BEFORE its group existed, where discovery
  # correctly resolves to the empty set and the policies must be named — the
  # bootstrap ordering that makes that shape likely is a recorded constraint, so
  # the seam exists here rather than requiring a template edit under pressure.
  # Adds to discovery, never replaces it; a malformed entry is a boot error.
  GOV_GROUP_POLICIES: {{ .Values.contract.govGroupPolicies | default "" | quote }}
  CONFIRMATION_DEPTH: {{ .Values.tuning.confirmationDepth | quote }}
  INDEX_WINDOW_SPAN: {{ .Values.tuning.indexWindowSpan | quote }}
  POLL_INTERVAL_MS: {{ .Values.tuning.pollIntervalMs | quote }}
  RECONCILE_INTERVAL_MS: {{ .Values.tuning.reconcileIntervalMs | quote }}

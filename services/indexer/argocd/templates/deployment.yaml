apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    tags.datadoghq.com/env: {{ .Values.datadog.env }}
    tags.datadoghq.com/service: {{ .Chart.Name }}
    tags.datadoghq.com/version: {{ .Values.datadog.version }}
    admission.datadoghq.com/enabled: "true"
    admission.datadoghq.com/config.mode: hostip
spec:
  # Two supervisors must not write concurrently. Two writes are unguarded:
  # `writeNav` in src/workers/chain-events/store.ts upserts the running marker
  # NAV with no observedHeight predicate, and `runWindow` in
  # src/runtime/checkpoint.ts advances the stream cursor with an unconditional
  # `cursorHeight` update. Overlap can therefore stamp a stale NAV over a newer
  # one AND walk a stream cursor backwards; `runWorker` reads its checkpoint once
  # at startup, so two supervisors stay offset rather than converging.
  #
  # `Recreate` closes the ROLLOUT case and only that case: the Deployment
  # controller will not create the new ReplicaSet while old pods are running, so
  # it is what keeps RollingUpdate (the Kubernetes default) from overlapping two
  # supervisors on every template change.
  #
  # It does NOT give at-most-one. A Deployment is at-least-one by design: when
  # the pod is deleted rather than replaced (node drain, node auto-upgrade,
  # preemption, eviction) the ReplicaSet controller creates the replacement as
  # soon as the old pod has a deletionTimestamp, while its container is still
  # running; an unreachable node has no bound at all.
  # `terminationGracePeriodSeconds` below bounds the routine case. Closing it
  # properly means either a StatefulSet (at-most-one per ordinal) or guarding the
  # two writes above in SQL — the house rule in services/indexer/CLAUDE.md
  # ("idempotency lives in the SQL, not in scheduling") — and that is tracked as
  # a decision rather than assumed here.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      annotations:
        # A ConfigMap edit does not restart pods on its own. Without this the
        # indexer keeps running stale configuration after a values change.
        checksum/config: {{ include (print $.Template.BasePath "/config-map.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        tags.datadoghq.com/env: {{ .Values.datadog.env }}
        tags.datadoghq.com/service: {{ .Chart.Name }}
        tags.datadoghq.com/version: {{ .Values.datadog.version }}
        admission.datadoghq.com/enabled: "true"
        admission.datadoghq.com/config.mode: hostip
    spec:
      serviceAccountName: {{ .Chart.Name }}
      # Bounds the overlap window described above: on a pod deletion the
      # replacement starts while this container is still running, so the shorter
      # this is, the shorter that window. A window is a throughput unit with a
      # 120 s transaction timeout (src/runtime/checkpoint.ts), so SIGKILL will
      # routinely land mid-window — that is safe by construction, because the
      # window transaction rolls back and the cursor does not move. Chosen
      # deliberately rather than inherited as the 30 s default.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Native sidecar (restartPolicy: Always): starts, and stays running,
        # before the regular initContainers below — so the proxy is already
        # listening when the migration runs.
        - name: cloud-sql-proxy
          restartPolicy: Always
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.17.1
          args:
            - "--private-ip"
            - "--auto-iam-authn"
            - "--structured-logs"
            - "--port=5432"
            - "{{ .Values.database.instanceName }}"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
        # Same image and digest as the app container, which is what makes the
        # schema and the code that reads it the same commit by construction.
        # `migrate deploy` is a no-op when the database is already current.
        - name: migrate
          image: {{ .Values.image.name }}:{{ .Values.image.tag }}
          workingDir: /app/services/indexer
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Declared so a namespace ResourceQuota that requires requests cannot
          # reject the pod. Applying one baseline migration is short and light.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.image.name }}:{{ .Values.image.tag }}
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config
          env:
            - name: DD_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/env']
            - name: DD_SERVICE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/service']
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/version']
          # No `ports` here, and no Service in this chart: the indexer serves no
          # HTTP to anyone. Liveness is the heartbeat file the supervisor writes
          # after each successful database ping, so both probes below prove the
          # process AND its database connection — which an HTTP probe could not.
          startupProbe:
            exec:
              command: ["node", "/app/services/indexer/scripts/healthcheck.mjs"]
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            exec:
              command: ["node", "/app/services/indexer/scripts/healthcheck.mjs"]
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: heartbeat
              mountPath: /heartbeat
            - name: tmp
              mountPath: /tmp
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        # The heartbeat path is what makes readOnlyRootFilesystem possible;
        # INDEXER_HEARTBEAT_FILE in the image points into this mount. The image
        # also creates the directory, so it stays runnable outside Kubernetes.
        - name: heartbeat
          emptyDir: {}
        - name: tmp
          emptyDir: {}

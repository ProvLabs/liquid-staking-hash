apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
  annotations:
    # Workload Identity. The bound GCP service account holds
    # roles/cloudsql.client + roles/cloudsql.instanceUser, and the matching
    # Cloud SQL IAM user inherits `indexer_writer` via infra/cloudsql/roles.sql.
    iam.gke.io/gcp-service-account: {{ .Chart.Name }}@{{ .Values.projectId }}.iam.gserviceaccount.com

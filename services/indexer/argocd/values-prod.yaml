projectId: provlabs-prod

image:
  name: us-central1-docker.pkg.dev/provlabs-prod/docker/nvhash-indexer

datadog:
  env: provlabs-prod-cluster

database:
  instanceName: provlabs-prod:us-central1:nuva-shared
  url: postgres://nvhash-indexer%40provlabs-prod.iam@localhost:5432/nvhash?schema=indexed&sslmode=disable

chain:
  rpcUrl: http://pio-mainnet-archive-rpc.provenance:26657
  lcdUrl: http://pio-mainnet-archive-rpc.provenance:1317
  chainId: pio-mainnet-1
  # Fail-closed until mainnet instantiate; see values-test.yaml for why 0 rather
  # than 1. Both must become the contract's instantiate height.
  startHeight: 0
  govStartHeight: 0

# Deliberately unset until mainnet instantiate. src/config.ts rejects a blank
# required value, so a premature sync cannot INDEX against an unknown chain.
#
# It does not stop the migrate initContainer, which needs only DATABASE_URL and
# so creates the `indexed` schema and `_prisma_migrations` before the app
# container ever validates config. While the schema is still one regenerated
# baseline, that leaves behind a recorded baseline whose checksum a later
# regeneration invalidates — so do not point this at a real instance early.
contract:
  address: ""
  vaultAddress: ""
  receiptDenom: ""
  # Comma-separated x/group policy addresses to mirror IN ADDITION to what
  # discovery finds. Leave empty unless the contract was instantiated before
  # its group existed; see templates/config-map.yaml.
  govGroupPolicies: ""
